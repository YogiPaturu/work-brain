name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package without optional model downloads
        run: python -m pip install --no-deps .
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -q
      - name: Compile sources
        run: PYTHONPATH=src python -m compileall -q src examples
      - name: Type-check lifecycle and hook boundaries
        run: |
          python -m pip install "mypy>=1.11,<2"
          python -m mypy
      - name: Check patch formatting
        run: git diff --check
      - name: Verify packaged Skill resources
        run: |
          python -m pip install build
          python -m build --wheel --outdir /tmp/work-brain-dist
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob('/tmp/work-brain-dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required_suffixes = (
              '/share/work-brain/migrations/006_experience_reverse_lookup.sql',
              '/share/work-brain/skills/work-brain/references/domain-tags.md',
              '/share/work-brain/skills/work-brain/references/schemas/commit-draft.md',
          )
          missing = [suffix for suffix in required_suffixes if not any(name.endswith(suffix) for name in names)]
          if missing:
              raise SystemExit(f'missing packaged resources: {missing}')
          print(f'verified {wheel}')
          PY
      - name: Load commit instructions from installed wheel
        run: |
          python -m pip install --force-reinstall --no-deps /tmp/work-brain-dist/*.whl
          WORK_BRAIN_SKILLS="$(python -c 'import sysconfig; print(sysconfig.get_path("data") + "/share/work-brain/skills")')" \
            python -c 'from work_brain import SkillLoader; loaded = SkillLoader().load("think", ["engineering"], include_commit_schema=True); assert "WORK-BRAIN-SCHEMA-COMMIT-DRAFT@1" in loaded.identities; assert "WORK-BRAIN-DOMAIN-TAGS@1" in loaded.identities; print("installed commit instructions loaded")'
