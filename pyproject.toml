[project]
name = "work-brain"
version = "0.1.0"
description = "Local-first Work Brain core persistence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
work-brain = "work_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
